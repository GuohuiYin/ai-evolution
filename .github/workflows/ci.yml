name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify
        run: ./mvnw -B verify
      # W30 #1：认证中心独立工程（auth-center/，独立 pom 不进根 reactor）——第二路 verify
      - name: Verify auth-center
        run: ./mvnw -B -f auth-center/pom.xml verify
