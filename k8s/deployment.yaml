apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-evolution
  labels:
    app: ai-evolution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-evolution
  template:
    metadata:
      labels:
        app: ai-evolution
    spec:
      containers:
        - name: ai-evolution
          image: ai-evolution:0.2.0-m2-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18080
          envFrom:
            - configMapRef:
                name: ai-evolution-config
            - secretRef:
                name: ai-evolution-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 18080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 18080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
