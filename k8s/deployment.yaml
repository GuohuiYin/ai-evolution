apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-evolution
  labels:
    app: ai-evolution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-evolution
  template:
    metadata:
      labels:
        app: ai-evolution
    spec:
      containers:
        - name: ai-evolution
          image: ai-evolution:0.1.0-w1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ai-evolution-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
