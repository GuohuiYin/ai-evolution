apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-evolution-config
data:
  SPRING_APPLICATION_NAME: ai-evolution
  # 约定 A7：K8s 部署关闭 Swagger UI（文档页面也是攻击面），/v3/api-docs JSON 保留
  SPRINGDOC_SWAGGER_UI_ENABLED: "false"
  # 向量库指向集群内 qdrant Service（gRPC 端口），域名由 K8s DNS 解析
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6334"
  # 检索调参显式声明：部署环境的检索口径对运维可见，不依赖代码默认值兜底
  AI_RAG_TOP_K: "5"
  AI_RAG_SIMILARITY_THRESHOLD: "0.5"
  AI_RAG_CHUNK_SIZE: "800"
  # K8s 部署形态：MCP Client 走 Streamable HTTP 连集群内独立 mcp-fetch 工作负载
  #（ADR-0016 观察项落地：stdio 是桌面协议不进容器；Java 镜像零 Python 依赖）
  SPRING_PROFILES_ACTIVE: k8s
  AI_MCP_CLIENT_ENABLED: "true"
