spring:
  application:
    name: ai-evolution
  lifecycle:
    timeout-per-shutdown-phase: 10s
  # W21 #1③：DataSource 自动配置显式关闭——会话记忆 L2 的 H2 数据源由 ConversationMemoryConfig
  # 按 ai.chat.memory.store 旗标手工装配，inmemory 缺省态不允许出现 DataSource 副作用；
  # 真接外部 DB 时再手工装配对应 DataSource（彼时此处一并放开）
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  ai:
    # 多供应商分工：聊天走 DeepSeek，Embedding 走 OpenAI 兼容协议（SiliconFlow bge-m3）
    model:
      chat: deepseek
      embedding: openai
      image: none
      moderation: none
    # CVE-2026-59318（红队欠账，W8-1）：工具解析兜底显式关闭。
    # 请求级工具列表才是真正的派发边界；不可解析的工具名 fail-fast，
    # 禁止回落到应用上下文全局工具表（提示注入越权通道）。
    # 2.0.1 库默认虽已是 false，但显式声明防未来版本默认值回翻，测试锁定见 ToolResolutionFailFastTest
    tools:
      resolution:
        fallback:
          enabled: false
      # 纵深防御（W8-1 顺手项）：每请求工具调用次数上限，防模型死循环/注入诱导反复调工具烧 token。
      # RETURN_ERROR_RESPONSE：超限作为错误观察喂回模型组织措辞，不击穿到用户（同 W7 脱敏思路）
      limits:
        max-total-tool-calls: 10
        on-limit-exceeded: RETURN_ERROR_RESPONSE
    # 内部重试只覆盖瞬时抖动：库默认 10 次指数退避（上限 3min/次），供应商级故障会被拖成
    # 十分钟级挂起，应急降级形同虚设（W12 #4c 故障注入实测抓获，线程栈停在 RetryTemplate.sleep）。
    # 快速失败后交给 FailoverChatModel 切备用供应商
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: ${AI_RETRY_BACKOFF_INITIAL:1s}
        multiplier: 2
        max-interval: 5s
    deepseek:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${AI_MODEL:deepseek-v4-flash}
    openai:
      api-key: ${SILICONFLOW_API_KEY:}
      # 注意：OpenAI 兼容客户端要求 base-url 包含 /v1 路径段，否则 404
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      embedding:
        # 环境变量可切换（W15 #1 对照实验需要换臂；chat.model 同一先例）
        model: ${AI_EMBEDDING_MODEL:BAAI/bge-m3}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: knowledge_base
        initialize-schema: true
    # W6-Step2：MCP Server。Streamable HTTP（现行标准，旧 SSE 已废弃且 Codex 不支持）；
    # 端点默认 POST /mcp，与 /ai/* 业务命名空间隔离
    mcp:
      server:
        name: ai-evolution
        version: 0.3.0-m3
        protocol: STREAMABLE
        type: SYNC
      # W12 #1：MCP Client（协议栈的另一半）——Agent 持证调外部服务取数。
      # 传输按部署形态分 profile：本地开发 stdio（uvx 子进程），K8s 走 Streamable HTTP
      # 连独立 mcp-fetch 工作负载（见文件尾部两个 profile 文档；stdio 是桌面协议，
      # 部署态业界标准是 HTTP——ADR-0016 观察项落地）
      client:
        # 测试上下文显式关闭（外部子进程不进测试）；本地/部署默认开，AI_MCP_CLIENT_ENABLED 可覆盖
        enabled: ${AI_MCP_CLIENT_ENABLED:true}
        type: SYNC
        name: ai-evolution-mcp-client
        # 协议级超时：外部网页慢响应不拖死研究 Loop（A11 策略外置）
        request-timeout: 30s
        # MCP 工具不自动注册为全局 ToolCallback——只经 ExternalToolClient 白名单派发，
        # 与 tools.resolution.fallback.enabled=false 同一安全立场（显式边界，防注入越权通道）
        toolcallback:
          enabled: false

server:
  port: 18080
  shutdown: graceful

ai:
  rag:
    # 检索调参集中于此：线上服务与 eval 验收门共用，保证"评估口径=线上口径"
    # top-k 语义：最终返回条数（hybrid/rerank 全关时是唯一口径；hybrid 开时是融合后截断数）
    top-k: 5
    similarity-threshold: 0.5
    # 查询改写温度（W15 #2）：改写是确定性任务（指代消解/格式变换，非创作），
    # 默认 0 消除同查询多轮措辞漂移（R3/R4 实测默认温度下检索排序翻转 ±2 条）
    rewrite-temperature: 0.0
    # 分块大小（token）：与检索质量直接相关，调整需以黄金集全量回归为前提
    # W13 #1 三轮对照（400/800/1200）数据裁决维持 800
    chunk-size: 800
    # W13 #2 两阶段召回：召回放大倍数（召回侧 topK），直接决定后续 rerank 计费量。
    # 20/40 两档黄金集实测无差异（小语料适配，非对标业界 50-200），定稿 20
    recall-top-k: 20
    rerank:
      # W13 #3 精排段（bge-reranker-v2-m3，SiliconFlow /rerank）总开关：默认关，
      # 黄金集 Recall@5 提升 ≥5pp 才翻 true（数据裁决同 hybrid 机制）
      enabled: false
      model: BAAI/bge-reranker-v2-m3
      # 精排后保留条数：rerank 开时接管最终返回口径（top-k 仅全关时生效）
      top-n: 5
    hybrid:
      # 混合检索（dense + sparse 字面路，RRF 融合）总开关。
      # W13 #2 数据裁决（2026-09-17）：黄金集 Recall@5 72%→93%（+21pp ≥ 5pp 达标线），
      # 负例拒答率 7/10 零回归——翻 true。报告 docs/eval/retrieval/w13-hybrid-eval.md
      enabled: true
      # RRF 融合常数：k=30/60/100 三档敏感性实测无差异（<1pp），锁经典值 60
      rrf-k: 60
    diversity:
      # W23 #2 主体配额：查询提到 ≥2 个在库主体时，召回段截口按主体保底名额重排，
      # 防 top-k 被单一主体垄断（病灶：W22 #3a 宁德/茅台比价案 top-5 全宁德）。
      # W23 #2 数据裁决（2026-10-26）：涉案案 buckets=[0,20]→[2,20] 修复 +
      # 黄金集回归 Recall@5 94.3% ≥ 93% 守线 + 生成 eval 5.3/6（W21 基线 5.0）——
      # 双证据达标翻 true。报告 docs/eval/retrieval/w23-diversity-quota.md
      enabled: ${AI_RAG_DIVERSITY_ENABLED:true}
      # subjects=在库主体词典（语料轮换/新增公司时同步维护）：规范名+别名+股票代码
      subjects:
        - name: 贵州茅台
          code: "600519"
          aliases: [茅台, maotai]
        - name: 宁德时代
          code: "300750"
          aliases: [宁德, catl]
    sparse:
      # W16 #2 sparse 路实现切换面：matchtext（Qdrant 全文索引，现状基线）/
      # bm25（A3-lite 应用侧分词 + TF 饱和，IDF 由 Qdrant 服务端 modifier 补）。
      # 值并入向量签名判变键——切换即全量重建。对照复跑：AI_RAG_SPARSE_IMPL=bm25
      impl: ${AI_RAG_SPARSE_IMPL:matchtext}
      bm25:
        # BM25 经典参数（Okapi 缺省值）：k1 控制词频饱和速度，b 控制长度归一强度
        k1: 1.5
        b: 0.75
    # RAG 通路 prompt 模板名（resources/prompts/ 下，不含后缀）。A/B 实验经配置切换：
    # AI_RAG_CHAT_PROMPT=rag-chat-v2-fewshot 跑 few-shot 对照（W8-4）
    # v3（W23 #2c）：措辞边界段——「本次未覆盖」≠「知识库无」（W22 #3a 病灶纠正）；回滚切 v1
    chat-prompt: rag-chat-v3
    # W11 #5 查询改写 prompt 模板名
    rewrite-prompt: query-rewrite-v1
    # W24 #1b 零召回防线：召回为空时换措辞重述再试一次（dense 阈值悬崖病灶——
    # 涉案案 top 分 0.4817 惜败 0.5 阈值，措辞差 0.06 分定生死）。重述 prompt 模板名见下。
    # 翻 true。证据：A/B 活探针同一必败查询 关=3/3 硬拒答、开=3/3 救回且重试日志全触发；
    # 无资料案拒答语义保持；检索回归 Recall@5 94.3% 过门。报告 docs/eval/retrieval/w24-zero-recall-retry.md
    zero-recall-retry: ${AI_RAG_ZERO_RECALL_RETRY:true}
    rephrase-prompt: query-rephrase-v1
  rewrite:
    # W11 #5 查询改写总开关：false 时切直通实现（#6 改写开/关两轮 eval 对比的对照组）
    # 环境变量 AI_REWRITE_ENABLED=false 即关闭
    enabled: true
  model:
    failover:
      # W12 #4：DeepSeek 故障（超时/5xx）自动切 Qwen（SiliconFlow 托管，复用 SILICONFLOW 凭证零新增密钥面）。
      # 降级期延迟显著升高（选型实测 30-60x），告警日志 + model.failover.total 计数器可见
      enabled: ${AI_MODEL_FAILOVER_ENABLED:true}
      model: ${AI_MODEL_FAILOVER_MODEL:Qwen/Qwen3.5-35B-A3B}
  stock:
    # 个股分析默认会计年度（mock 种子数据按 2024 口径）
    analysis-year: 2024
    # 行情/财务数据源（W17 #1）：mock（缺省，内置种子）/ tushare（真源 REST 直连）。
    # 真源切换：AI_STOCK_DATA_SOURCE=tushare + TUSHARE_TOKEN（tushare.pro 个人中心获取）
    data-source: ${AI_STOCK_DATA_SOURCE:mock}
    tushare:
      token: ${TUSHARE_TOKEN:}
      base-url: ${TUSHARE_BASE_URL:https://api.tushare.pro}
      timeout-seconds: 5
  agent:
    # Agent 工具通路 prompt 模板名（resources/prompts/ 下，不含后缀）。
    # v2 起含反缝合规则（实体不匹配禁止拼接推算，W9-2）；A/B 对照经 AI_AGENT_CHAT_PROMPT 切换
    chat-prompt: agent-chat-v2
  loop:
    # W11 #3：显式 ReAct 循环。协议 prompt（含 {TOOL_MANUAL} 占位符，由 ToolRegistry 渲染注入）
    # v2 起含协议纪律段（英文标记强制 + 中文标记反例，W20 #1）；回滚经 AI_LOOP_REACT_PROMPT 切换
    react-prompt: agent-react-v2
    # 触顶合成步 prompt（W20 #1 裁决①B）：MAX_STEPS 后无工具收尾，诚实红线绑定
    synthesis-prompt: agent-react-synthesis-v1
    # 研究步数上限：防死循环/注入诱导烧 token（复用工具调用上限思想，RETURN_ERROR_RESPONSE 同族）
    max-steps: 6
    # 循环引擎（W22 #1 验收后切换）：pipeline=三角色管线（Planner→Builder→Reviewer，
    # Temporal activity 化，缺省——57 案对照 +0.33 且红线满维，见 docs/eval/generation/w22-pipeline-dual-arm.md）；
    # temporal=单循环事件历史版；inline=进程内直跑（对照臂留旗标）。
    # pipeline/temporal 均需本地 dev server：temporal server start-dev（见 docs/notes/temporal-minimal-loop.md）
    engine: ${AI_LOOP_ENGINE:pipeline}
    # HITL 人工审批断点（W23 #1，裁决①B：只接「打回耗尽升级人工」一条触发，仅 pipeline 引擎有效）：
    # true=复核 3 轮仍打回时挂起等人工 Signal（approve 放行 / reject 驳回），false=沿用即时拒答。
    # 缺席策略显式化：await-timeout 内未决 fail-closed 拒答（宁可不答不可错答）。
    hitl:
      enabled: ${AI_LOOP_HITL_ENABLED:false}
      await-timeout: ${AI_LOOP_HITL_AWAIT_TIMEOUT:PT2H}
    temporal:
      # Temporal 服务 gRPC 地址（CLI 注意显式 IPv4：localhost 会优先解析 ::1）
      target: ${TEMPORAL_TARGET:127.0.0.1:7233}
  skill:
    # 技能目录（W22 #2）：SkillRegistry 启动扫描，YAML 头 name/description/triggers
    location: ${AI_SKILL_LOCATION:classpath*:skill/*/SKILL.md}
    # 注入模式（W22 #2 实测期间默认 off 零行为变化）：off=不注入；full=全文常驻（对照臂）；
    # progressive=元数据常驻+命中注入正文（渐进披露臂）——实测定档后调默认
    mode: ${AI_SKILL_MODE:off}
  chat:
    # 统一入口路由策略（ChatRouter）：命中股票代码或下列关键词 → Agent 工具通路；其余 → RAG 管道
    agent-keywords: 股价,行情,走势,营收,净利,利润,财务
    memory:
      # 会话记忆滑动窗口（条数）：超出后最旧消息淘汰
      window: 20
      # 仓储实现（W21 #1③ L2 落地）：inmemory=内存版（缺省，重启失忆）；
      # jdbc=MySQL 持久化（重启记忆仍在，多副本同源——容器 ai-evolution-mysql，docker 起）
      store: ${AI_CHAT_MEMORY_STORE:inmemory}
      # jdbc 模式连接串与凭据（凭据在 .env，A5 密钥隔离）；
      # createDatabaseIfNotExist 兜底建库；换外部库改 url + 凭据即迁移，业务代码零改动
      jdbc-url: ${AI_CHAT_MEMORY_JDBC_URL:jdbc:mysql://localhost:3306/ai_evolution?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
      jdbc-username: ${AI_CHAT_MEMORY_JDBC_USERNAME:root}
      jdbc-password: ${AI_CHAT_MEMORY_JDBC_PASSWORD:}
    prompt-logging:
      # W8-6：日志记录模型输入 prompt 与返回 response（SimpleLoggerAdvisor，DEBUG 级）。
      # 本地默认开；生产必须关（金融语料敏感）。该 logger 级别需同时为 DEBUG 才生效，见 logging 段
      enabled: true
  tool:
    # 工具入参长度上限（红队基线 M3 修复：防超长 query 直达上游付费 API 的成本攻击）
    max-query-length: 2000
  security:
    # W12 #2：API Key 鉴权（强制项，请求头 X-API-Key）。空值启动 fail-fast——
    # 鉴权没有"忘记开"的静默中间态。放行清单见 SecurityAllowlist（测试锁定）
    api-key: ${AI_EVOLUTION_API_KEY:}
    rate-limit:
      # W12 #3：固定窗口限流，每身份（API Key，无凭证按 IP）每分钟次数上限。
      # 单实例内存实现；多副本场景待 L2 持久化一起谈（周计划"明确不做"）
      per-minute: 60
  mcp:
    fetch:
      # 抓取正文喂回模型前的长度上限：网页原文无界，防单页烧爆上下文与 token 账本（A11 策略外置）
      max-content-length: 8000
  knowledge:
    ingest:
      # 启动时摄入知识库；测试环境关闭避免打真实 Embedding API
      enabled: true
    # W8-2 增量摄入清单：记录每文件 SHA-256 + chunkIds，未变文件零 embedding 调用
    # 构建产物路径，不入 git；删除或损坏视为空清单，触发全量重建（可自愈）
    manifest-path: build/knowledge-manifest.json
  eval:
    # M1 验收门阈值：正例 Recall@topK 低于此值不得进入下一阶段
    gate-threshold: 0.7
  feedback:
    # W24 #3 人工反馈回路最小环：👍/👎 badcase 登记库（JSON 文件，不依赖 DataSource，
    # 记忆仓储 inmemory/jdbc 两态皆可用）。👎 进 PENDING_REVIEW，回流黄金集必须人工裁定
    # （Owner 裁决②A）——scripts/badcase_review.py list/approve/reject
    file: ${AI_FEEDBACK_FILE:data/feedback.jsonl}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

# 可观测性基座：控制台日志统一带 traceId（TraceIdFilter 写入 MDC），调用链按号串联
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [traceId=%X{traceId:--}] %-40.40logger{39}: %m%n"
  level:
    # W8-6：SimpleLoggerAdvisor 的 prompt/response 日志走 DEBUG；生产关闭时把 ai.chat.prompt-logging.enabled 置 false 即可
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG

---
# 本地开发形态（default profile：未显式设置 SPRING_PROFILES_ACTIVE 时生效，
# k8s profile 激活时本文档不加载，stdio 连接不会出现）：stdio 拉起官方
# mcp-server-fetch（uvx 常驻子进程，启动时建立连接）
spring:
  config:
    activate:
      on-profile: default
  ai:
    mcp:
      client:
        stdio:
          connections:
            fetch:
              # uvx 路径走环境变量（开发机 PATH 各异，CI 不需要）；args 无 --ignore-robots-txt：
              # 尊重目标站 robots 是默认正确姿态，抓取演示选无争议页面
              command: ${MCP_FETCH_COMMAND:uvx}
              # --offline（2026-09-29 Owner 裁决，fail-fast 立场）：启动关键路径不做在线版本
              # 解析——PyPI/镜像抖动时 uvx 重试 46.8s > 20s 初始化超时，整个应用 fail-fast；
              # 离线走本地缓存（首次使用先手工 uvx mcp-server-fetch 预热），
              # 缓存缺失时报错也比"等 46s 再超时"直白
              args:
                - --offline
                - mcp-server-fetch
              env:
                # uv 解析走镜像（2026-09-16 实测：默认 PyPI 源 7s+/请求且缓存按 index 分桶，
                # 冷启动远超 20s 初始化握手超时；镜像 ~5s）。环境已配 UV_INDEX_URL 时透传覆盖
                UV_INDEX_URL: ${UV_INDEX_URL:https://pypi.tuna.tsinghua.edu.cn/simple}

---
# K8s 部署形态（SPRING_PROFILES_ACTIVE=k8s，由 ConfigMap 注入）：Streamable HTTP
# 连集群内独立 mcp-fetch Service——连接键仍为 fetch，McpClientToolConfiguration
# 按 "... - fetch" 后缀识别，两种传输对上层零差异（契约不变式）
spring:
  config:
    activate:
      on-profile: k8s
  ai:
    mcp:
      client:
        streamable-http:
          connections:
            fetch:
              url: ${MCP_FETCH_URL:http://mcp-fetch:8000/mcp}
