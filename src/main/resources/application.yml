spring:
  application:
    name: ai-evolution
  lifecycle:
    timeout-per-shutdown-phase: 10s
  # 临时排除：Qdrant VectorStore 自动装配强依赖 EmbeddingModel Bean，
  # W3-Step2 接入真实 Embedding 模型（SiliconFlow bge-m3）后移除此行
  autoconfigure:
    exclude: org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
  ai:
    deepseek:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
