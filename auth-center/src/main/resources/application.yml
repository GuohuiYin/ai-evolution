# auth-center：统一认证授权中心（W30 #1），独立于主应用（18080）部署
server:
  port: ${AUTH_CENTER_PORT:19000}

spring:
  application:
    name: auth-center
  security:
    oauth2:
      authorizationserver:
        # JWT iss 声明与发现元数据的签发方标识（部署态换域名，env 注入）
        issuer: ${AUTH_CENTER_ISSUER:http://localhost:19000}
        client:
          # 机器通道（MCP 客户端，客户端凭证流）。机器密钥=高熵随机串，管理姿势同 API key
          # （A5 env 注入）；argon2 慢哈希留给人类密码（步骤 3 identity 域）。
          # {noop} 前缀：SAS 用 DelegatingPasswordEncoder 解码，高熵机器密钥无需慢哈希
          mcp-client:
            registration:
              client-id: mcp-client
              client-secret: "{noop}${AUTH_CLIENT_MCP_SECRET:dev-only-mcp-secret-change-me}"
              client-authentication-methods: client_secret_basic
              authorization-grant-types: client_credentials
              scopes:
                - writer
            token:
              # W30 #4：访问令牌 1 小时——机器通道一签一用（脚本每次运行新取），
              # 长任务（如 W26 仿真 3h）中途过期由 401 重取覆盖；无吊销通道，泄露窗口=TTL
              access-token-time-to-live: PT1H
          # 人通道（对话页 SPA，授权码+PKCE）：public client 无密钥，require-proof-key 强制 PKCE；
          # consent 页显式关闭——一方应用（自家对话页）无需三方授权确认页（ADR-0013 显式配置精神）；
          # redirect-uri 与 W30 #3 对话页实现对齐——改动必须前后端同步
          ai-evolution-web:
            require-proof-key: true
            registration:
              client-id: ai-evolution-web
              client-authentication-methods: none
              authorization-grant-types: authorization_code
              redirect-uris: http://localhost:18080/callback
              scopes:
                - reader
                - writer
            token:
              # W30 #4：访问令牌 1 小时（SAS 默认 5 分钟太短，对话体验会频繁无感重登）；
              # 不发 refresh token（registration 未开该 grant）——过期即 401 → 对话页自动重登，
              # 中心会话（JSESSIONID）存活时秒回，等效无感续期；吊销语义 = 换钥全失效（见 #4 ADR）
              access-token-time-to-live: PT1H

  datasource:
    # identity 域用户表：auth 独立 schema（与主应用同 MySQL 实例、库级隔离；
    # 连接串兜底建库，纯 JDBC 无 JPA/Flyway——同主工程姿势）
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${AUTH_DB_USERNAME:root}
    password: ${AUTH_DB_PASSWORD:}
  sql:
    init:
      mode: always

# identity 域：admin 种子（哈希由 PasswordHashTool 离线生成，{argon2} 前缀格式，明文不过夜）；
# 用户表无 admin 且此值为空时启动 fail-closed（无 admin 的系统无人能审批，宁可起不来）
auth:
  identity:
    admin-username: ${AUTH_ADMIN_USERNAME:admin}
    admin-password-hash: ${AUTH_ADMIN_PASSWORD_HASH:}
  cors:
    # W30 #3：对话页 SPA（18080）跨域调 /oauth2/token 换 token 是 XHR，浏览器有预检——
    # 白名单显式声明 SPA origin（授权跳转本身是浏览器重定向，不经过 CORS）
    allowed-origins: ${AUTH_CENTER_CORS_ORIGINS:http://localhost:18080}
  jwt:
    # W30 #4：JWT 签名私钥（PKCS8 PEM，换行用字面 \n 转义；部署态经 Secret 注入）。
    # 留空 = 每启动临时生成（本地开发姿态，重启换钥全失效，WARN 有声化）；提供但解析失败 fail-closed
    private-key-pem: ${AUTH_JWT_PRIVATE_KEY:}

# K8s 友好最小集（C1）：探针分离；文档面不外露（A7 同纪律，本工程无业务端点文档需求）
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
