# auth-center：统一认证授权中心（W30 #1），独立于主应用（18080）部署
server:
  port: ${AUTH_CENTER_PORT:19000}

spring:
  application:
    name: auth-center
  security:
    oauth2:
      authorizationserver:
        # JWT iss 声明与发现元数据的签发方标识（部署态换域名，env 注入）
        issuer: ${AUTH_CENTER_ISSUER:http://localhost:19000}
        client:
          # 机器通道（MCP 客户端，客户端凭证流）。机器密钥=高熵随机串，管理姿势同 API key
          # （A5 env 注入）；argon2 慢哈希留给人类密码（步骤 3 identity 域）。
          # {noop} 前缀：SAS 用 DelegatingPasswordEncoder 解码，高熵机器密钥无需慢哈希
          mcp-client:
            registration:
              client-id: mcp-client
              client-secret: "{noop}${AUTH_CLIENT_MCP_SECRET:dev-only-mcp-secret-change-me}"
              client-authentication-methods: client_secret_basic
              authorization-grant-types: client_credentials
              scopes:
                - writer

  datasource:
    # identity 域用户表：auth 独立 schema（与主应用同 MySQL 实例、库级隔离；
    # 连接串兜底建库，纯 JDBC 无 JPA/Flyway——同主工程姿势）
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${AUTH_DB_USERNAME:root}
    password: ${AUTH_DB_PASSWORD:}
  sql:
    init:
      mode: always

# identity 域：admin 种子（哈希由 PasswordHashTool 离线生成，{argon2} 前缀格式，明文不过夜）；
# 用户表无 admin 且此值为空时启动 fail-closed（无 admin 的系统无人能审批，宁可起不来）
auth:
  identity:
    admin-username: ${AUTH_ADMIN_USERNAME:admin}
    admin-password-hash: ${AUTH_ADMIN_PASSWORD_HASH:}

# K8s 友好最小集（C1）：探针分离；文档面不外露（A7 同纪律，本工程无业务端点文档需求）
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
